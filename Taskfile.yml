version: '3'

# Optional flattened include in the user's global Taskfile; no credentials here.
tasks:
  open:jira:
    aliases: ['jira']
    desc: Open the installed Jira TUI
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - jirawarrior
    interactive: true
    silent: true

  check:jira:
    aliases: ['jira:check']
    desc: Check the installed Jira connection with GET only, without changing state
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - jirawarrior --check
    silent: true
