name: Deterministic verification

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      # GitHub owns this attempt's immutable SHA/job logs; do not upload local private receipts.
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --frozen python scripts/verify.py _run fast
